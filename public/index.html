<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aúra 成本系統</title>

  <!-- DNS 預連線：加速 CDN 資源載入 -->
  <link rel="preconnect" href="https://cdn.tailwindcss.com">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="dns-prefetch" href="https://cdn.tailwindcss.com">
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Chart.js：延遲載入（僅損益總覽頁使用，由 analysisSummary.js 動態引入）-->

  <!-- 自訂樣式 -->
  <link rel="stylesheet" href="/css/main.css">
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- 頂部導覽列 -->
  <nav class="glass-nav sticky top-0 z-50 font-apple">
    <div class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">
      <a href="#/" class="flex items-center gap-2.5">
        <div class="h-9 w-9 rounded-full overflow-hidden ring-2 ring-white shadow-md flex-shrink-0">
          <img src="/images/logo.jpg" alt="Aúra" class="w-full h-full object-cover">
        </div>
        <span class="font-semibold text-slate-900" style="letter-spacing:-0.015em">成本系統</span>
      </a>
      <div class="flex items-center gap-0.5">
        <a href="#/" data-nav="home" class="nav-link active">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
          </svg>
          產品列表
        </a>
        <a href="#/analysis" data-nav="analysis" class="nav-link">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
          </svg>
          損益總覽
        </a>
        <a href="#/payments" data-nav="payments" class="nav-link">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/>
          </svg>
          現金財務記錄
        </a>
        <a href="#/kols" data-nav="kols" class="nav-link">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
          </svg>
          KOL 分潤
        </a>
      </div>
    </div>
  </nav>

  <!-- 主要內容區 -->
  <main id="app" class="min-h-[calc(100vh-3.5rem)]">
    <div class="flex justify-center items-center py-24">
      <div class="spinner"></div>
    </div>
  </main>

  <!-- Modal 掛載點 -->
  <div id="modal-root"></div>

  <!-- Toast 通知容器 -->
  <div id="toast-container"></div>

  <!-- JavaScript（defer：非阻塞載入，DOMContentLoaded 後依序執行）-->
  <script defer src="/js/api.js"></script>
  <script defer src="/js/utils.js"></script>
  <script defer src="/js/pages/productList.js"></script>
  <script defer src="/js/pages/productDetail.js"></script>
  <script defer src="/js/pages/analysisSummary.js"></script>
  <script defer src="/js/pages/paymentList.js"></script>
  <script defer src="/js/pages/kolList.js"></script>
  <script defer src="/js/router.js"></script>
</body>
</html>
