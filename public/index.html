<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aúra 成本系統</title>

  <!-- DNS 預連線：加速 CDN 資源載入 -->
  <link rel="preconnect" href="https://cdn.tailwindcss.com">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="dns-prefetch" href="https://cdn.tailwindcss.com">
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Chart.js：延遲載入（僅損益總覽頁使用，由 analysisSummary.js 動態引入）-->

  <!-- 自訂樣式 -->
  <link rel="stylesheet" href="/css/main.css">
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- 頂部導覽列 -->
  <nav class="glass-nav sticky top-0 z-50 font-apple">
    <div class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">
      <a href="#/" class="flex items-center gap-2.5">
        <div class="h-9 w-9 rounded-full overflow-hidden ring-2 ring-white shadow-md flex-shrink-0">
          <img src="/images/logo.jpg" alt="Aúra" class="w-full h-full object-cover">
        </div>
        <span class="font-semibold text-slate-900" style="letter-spacing:-0.015em">成本系統</span>
      </a>
      <div class="flex items-center gap-0.5">
        <a href="#/" data-nav="home" class="nav-link">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
          總覽
        </a>
        <a href="#/payments" data-nav="ledger" class="nav-link">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
          記帳
        </a>
        <a href="#/products" data-nav="products" class="nav-link">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/></svg>
          產品與定價
        </a>
        <a href="#/inventory" data-nav="inventory" class="nav-link">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
          庫存
        </a>
      </div>
    </div>
  </nav>

  <!-- 子分頁（記帳、產品與定價）-->
  <div id="subnav"></div>

  <!-- 主要內容區 -->
  <main id="app" class="min-h-[calc(100vh-3.5rem)]">
    <div class="flex justify-center items-center py-24">
      <div class="spinner"></div>
    </div>
  </main>

  <!-- Modal 掛載點 -->
  <div id="modal-root"></div>

  <!-- Toast 通知容器 -->
  <div id="toast-container"></div>

  <!-- JavaScript（defer：非阻塞載入，DOMContentLoaded 後依序執行）-->
  <script defer src="/js/api.js"></script>
  <script defer src="/js/utils.js"></script>
  <script defer src="/js/finance.js"></script>
  <script defer src="/js/pages/productList.js"></script>
  <script defer src="/js/pages/productDetail.js"></script>
  <script defer src="/js/pages/analysisSummary.js"></script>
  <script defer src="/js/pages/paymentList.js"></script>
  <script defer src="/js/pages/kolList.js"></script>
  <script defer src="/js/pages/inventoryList.js"></script>
  <script defer src="/js/pages/dashboard.js"></script>
  <script defer src="/js/router.js"></script>
</body>
</html>
