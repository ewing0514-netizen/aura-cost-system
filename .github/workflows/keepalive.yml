name: Keep Supabase Alive

# 每 12 小時打一次線上 API（會查詢 Supabase），避免免費專案閒置被自動暫停。
# Supabase 免費版約閒置 7 天才暫停，每 12 小時遠超足夠。
on:
  schedule:
    - cron: '0 */12 * * *'   # UTC 每 12 小時（約台灣 08:00 / 20:00）
  workflow_dispatch: {}        # 也可在 Actions 頁面手動觸發

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint to keep the database warm
        run: |
          # /healthz 為公開端點（不需密碼），內部會查詢 Supabase 一次以保持活躍，但不回傳任何資料
          URL="https://aura-cost-system-production.up.railway.app/healthz"
          code=$(curl -s -m 30 -o /tmp/h.json -w "%{http_code}" "$URL")
          echo "healthz -> HTTP $code · $(cat /tmp/h.json)"
          if [ "$code" != "200" ]; then
            echo "::warning::healthz 未回 200，資料庫可能正在喚醒或異常"
          fi
          exit 0
